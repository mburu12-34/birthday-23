<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Claris ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="stars"></div>
  <div id="fireworks"></div>
  <div id="confetti"></div>

  <!-- INTRO -->
  <div id="intro" class="intro">
    <div class="intro-glow"></div>
    <div class="heart">❤️</div>
    <div class="small-intro">SPECIAL CELEBRATION</div>
    <h1>CLARIS</h1>
    <div class="intro-text">Turning 23 today!</div>
    <button id="beginButton">Begin Experience</button>
  </div>

  <!-- COUNTDOWN -->
  <div id="countdownScene" class="scene hidden">
    <div id="countdown"></div>
  </div>

  <!-- BIRTHDAY -->
  <div id="birthday" class="birthday hidden">
    <div class="age-subtitle">CELEBRATING</div>
    <div class="age"><span>2</span><span>3</span></div>
    <h1>Happy Birthday</h1>
    <h2>Claris ❤️</h2>

    <div class="cake">
      <div class="plate"></div>
      <div class="cake-body"></div>
      <div class="cake-top">
        <div class="icing"></div>
        <div class="cake-line"></div>
        <div class="cake-line second"></div>
      </div>
      <div id="candles" class="candle-row"></div>
    </div>

    <div id="wish" class="wish hidden">
      <h3>Make a wish 🎂</h3>
      <button id="wishButton">Blow Candles</button>
    </div>

    <div id="message" class="message hidden">
      <p class="love">Claris, you are loved beyond words 💖</p>
      <p class="final-line">May this year bring joy, success, and endless happiness!</p>
      <div class="beautiful">✨ You are beautiful ✨</div>
    </div>
  </div>

  <!-- MUSIC -->
  <audio id="birthdayMusic" src="birthday.mp3"></audio>

  <script src="script.js" defer></script>
</body>
</html><link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
